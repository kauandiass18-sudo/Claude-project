<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tudo · LOTE</title>
  <meta name="description" content="Todas as peças: calças cargo, camisetas, camisas e bermudas, com filtros de tamanho, cor e modelagem.">
  <meta name="theme-color" content="#0D0D0C">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" href="assets/img/marca/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/marca/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/marca/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/vitrine.css">
  <script src="config/marca.js"></script>
  <script src="assets/js/nucleo.js"></script>
  <script src="data/catalogo.js" defer></script>
  <script src="assets/js/interface.js" defer></script>
  <script src="assets/js/pagina-catalogo.js" defer></script>
</head>
<body>
  <a class="pular" href="#resultados">Pular para os produtos</a>
  <header data-topo class="topo"></header>

  <main id="conteudo">
    <div class="conteiner">
      <header class="cabecalho-pagina">
        <nav aria-label="Você está em">
          <ol class="migalhas" data-migalhas>
            <li><a href="index.html">Início</a></li>
            <li><span aria-current="page">Tudo</span></li>
          </ol>
        </nav>
        <div class="cabecalho-pagina__linha">
          <h1 class="titulo-pagina entrada" style="--i:0" data-titulo>Tudo</h1>
        </div>
        <p class="texto-apoio entrada" style="--i:1" data-descricao></p>
      </header>
    </div>

    <div class="barra-filtros" data-barra>
      <div class="conteiner barra-filtros__interno">
        <div class="barra-filtros__linha" data-linha-categorias>
          <nav class="chips" aria-label="Categorias" data-chips></nav>
        </div>
        <div class="barra-filtros__linha" data-linha-ferramentas></div>
      </div>
    </div>

    <div class="conteiner" id="resultados" tabindex="-1">
      <div class="ativos" data-ativos hidden></div>
      <p class="resultado-contagem" data-contagem role="status" aria-live="polite"></p>
      <div class="catalogo-grade" data-area></div>
    </div>

    <noscript>
      <div class="conteiner estado">
        <h2>Ative o JavaScript para ver os produtos</h2>
        <p>A vitrine monta o catálogo no seu navegador. Ative o JavaScript e recarregue a página.</p>
      </div>
    </noscript>
  </main>

  <footer data-rodape class="rodape"></footer>
</body>
</html>
