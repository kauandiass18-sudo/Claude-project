<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página não encontrada · LOTE</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D0D0C">
  <script>
    /* Esta página pode ser servida em qualquer endereço inexistente.
       A <base> aponta os links para a pasta da vitrine ("/lote/")
       ou para a raiz do domínio quando a vitrine estiver publicada nela. */
    (function () {
      var p = location.pathname, i = p.indexOf('/lote/');
      document.write('<base href="' + (i >= 0 ? p.slice(0, i + 6) : '/') + '">');
    })();
  </script>
  <link rel="icon" href="assets/img/marca/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/vitrine.css">
  <script src="config/marca.js"></script>
  <script src="assets/js/nucleo.js"></script>
  <script src="data/catalogo.js" defer></script>
  <script src="assets/js/interface.js" defer></script>
  <script src="assets/js/pagina-texto.js" defer></script>
</head>
<body data-titulo="Página não encontrada">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header data-topo class="topo"></header>

  <main id="conteudo" tabindex="-1">
    <div class="conteiner">
      <div class="estado" style="padding-block: 120px;">
        <p class="titulo-display" aria-hidden="true" style="color: var(--cor-tinta-3);">404</p>
        <h1>Esta página não existe</h1>
        <p>O endereço pode ter mudado ou a peça saiu do lote.</p>
        <div class="estado__acoes">
          <a class="botao botao--claro" href="catalogo.html" data-link="catalogo.html">Ver todas as peças</a>
          <a class="botao botao--suave" href="index.html" data-link="index.html">Página inicial</a>
        </div>
      </div>
    </div>
  </main>

  <footer data-rodape class="rodape"></footer>
</body>
</html>
