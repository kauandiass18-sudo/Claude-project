<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel · House Hamburgueria 66</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E0B0A">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <!-- LOGIN -->
  <main class="login" data-tela-login hidden>
    <form class="login__caixa" data-form-login novalidate>
      <img src="assets/img/logo-192.webp" alt="" width="72" height="72">
      <h1>Painel da House</h1>
      <p class="login__sub">Cardápio, preços, fotos, promoções e pedidos.</p>
      <div class="campo" data-campo-email>
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" autocomplete="current-password" required>
      </div>
      <p class="erro" data-login-erro role="alert"></p>
      <button class="btn btn--vermelho btn--bloco" type="submit">Entrar</button>
      <p class="login__demo" data-login-demo hidden></p>
      <a class="login__voltar" href="index.html">Voltar ao site</a>
    </form>
  </main>

  <!-- PAINEL -->
  <div class="app" data-tela-app hidden>
    <header class="barra-topo">
      <a class="marca" href="index.html" title="Ver o site"><img src="assets/img/logo-192.webp" alt="" width="36" height="36"><span>House <small>Painel</small></span></a>
      <span class="modo" data-modo></span>
      <a class="link-topo" href="index.html" target="_blank" rel="noopener">Ver site</a>
      <button type="button" class="link-topo" data-sair>Sair</button>
    </header>
    <nav class="abas" role="tablist" aria-label="Seções do painel">
      <button type="button" role="tab" data-aba="pedidos" aria-selected="true">Pedidos <span class="bolha" data-bolha-novos hidden></span></button>
      <button type="button" role="tab" data-aba="produtos" aria-selected="false">Cardápio</button>
      <button type="button" role="tab" data-aba="categorias" aria-selected="false">Categorias</button>
      <button type="button" role="tab" data-aba="promocoes" aria-selected="false">Promoções</button>
      <button type="button" role="tab" data-aba="loja" aria-selected="false">Loja</button>
    </nav>
    <main class="conteudo" data-conteudo></main>
  </div>

  <dialog class="editor" data-editor aria-labelledby="editor-titulo">
    <form data-form-editor novalidate>
      <header class="editor__topo">
        <h2 id="editor-titulo" data-editor-titulo>Editar</h2>
        <button type="button" class="icone" data-fechar-editor aria-label="Fechar">×</button>
      </header>
      <div class="editor__corpo" data-editor-corpo></div>
      <footer class="editor__rodape" data-editor-rodape></footer>
    </form>
  </dialog>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
