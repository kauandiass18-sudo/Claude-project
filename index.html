<body class="pagina-inicial">
  <main class="perfil">
    <header class="capa">
      <p class="capa__selo revelar" style="--i:0">Curadoria capilar</p>
      <div class="arco revelar" style="--i:1" data-perfil-foto></div>

    <nav class="botoes" aria-label="Minha seleção nas lojas">

        <span class="botao-marca__seta"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg></span>
      </a>

        <span class="botao-marca__texto">Meus achadinhos da Shopee</span>
        <span class="botao-marca__seta"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg></span>

    </nav>

    <!-- Vitrine Ybera Paris (produtos em data/ybera.js) -->
    <section class="vitrine tema-ybera" data-loja="ybera" data-card-categoria="nao" data-numerar="sim"
      data-rotulo-todos="Todos"
      data-vazio-titulo="A seleção Ybera está quase pronta"
      data-vazio-texto="Os produtos escolhidos a dedo entram aqui em breve."
      data-sem-resultado="Nada com esse nome por aqui"
      aria-labelledby="titulo-ybera">
      <div class="vitrine__cabecalho revelar" style="--i:6">
        <h2 id="titulo-ybera" class="vitrine__titulo" data-loja-titulo>Ybera Paris</h2>
        <p class="vitrine__subtitulo" data-loja-subtitulo></p>
      </div>

      <div class="busca" role="search" data-area-busca>
        <label class="sr-only" for="busca">Buscar produto ou tratamento Ybera</label>
        <span class="busca__icone"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input id="busca" class="busca__campo" type="search" placeholder="Buscar produto ou tratamento" autocomplete="off" enterkeyhint="search" data-busca>
        <button type="button" class="busca__limpar" aria-label="Limpar pesquisa" data-busca-limpar hidden>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <p class="chips__titulo" id="titulo-categorias" data-categorias-titulo>O que o seu cabelo pede hoje?</p>
      <nav class="chips" aria-labelledby="titulo-categorias" data-categorias></nav>

      <section class="secao" aria-labelledby="titulo-destaques" data-destaques-secao>
        <div class="secao__cabecalho">
          <h3 id="titulo-destaques" class="secao__titulo">Queridinhos do salão</h3>
        </div>
        <div class="trilho" data-destaques></div>
      </section>

      <section class="secao" aria-labelledby="titulo-produtos" data-produtos-secao>
        <div class="secao__cabecalho">
          <h3 id="titulo-produtos" class="secao__titulo" data-produtos-titulo aria-live="polite">Todos os cuidados que o seu cabelo merece</h3>
        </div>
        <ul class="lista" data-lista></ul>
      </section>

      <div class="vazio" data-vazio hidden></div>

      <a class="botao-loja" target="_blank" rel="sponsored noopener" data-link-loja hidden>
        <span data-link-loja-texto></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>

    </section>

  <footer class="rodape" data-rodape></footer>
