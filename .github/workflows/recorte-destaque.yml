name: Recortar foto do produto em destaque

# Baixa a foto grande de um produto da Ybera, tira o fundo (fica
# transparente) e dá um acabamento (contraste, nitidez), para ele flutuar
# no fundo da Loja Ybera, atrás dos produtos.
# Para trocar o produto: aba Actions → esta tarefa → Run workflow → número
# do produto (o número no fim do link, ex.: 150264). Depois, em
# data/ybera.js, troque o caminho em produtoFundo para ybera-<número>.webp.
on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Número do produto da Ybera (ex.: 150264)"
        required: true
        default: "150264"
  push:
    branches: [claude/editar-minha-curadoria-l4zjab]
    paths: [.github/workflows/recorte-destaque.yml]

permissions:
  contents: write

jobs:
  recortar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUTO: ${{ github.event.inputs.produto || '150264' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o recortador
        run: pip install --quiet "rembg[cpu]" pillow
      - name: Baixar e recortar
        shell: python
        run: |
          import io, json, os, re, urllib.request
          from PIL import Image
          from rembg import new_session, remove
          pid = os.environ["PRODUTO"].strip()
          cat = json.load(open("data/ybera-catalogo.json", encoding="utf-8"))
          prod = next(p for p in cat["produtos"] if p["id"] == pid)
          url = re.sub(r"\?.*$", "", prod["imagem"]) + "?w=2000&h=2000"
          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          dados = urllib.request.urlopen(urllib.request.Request(url, headers={"user-agent": ua}), timeout=60).read()
          print("foto original:", len(dados), "bytes")
          sem_fundo = remove(dados, session=new_session("isnet-general-use"))
          im = Image.open(io.BytesIO(sem_fundo)).convert("RGBA")
          # Corta pelo que é visível de verdade (ignora sombra quase transparente)
          alfa = im.getchannel("A")
          alfa = alfa.point(lambda v: 0 if v < 24 else v)
          im.putalpha(alfa)
          caixa = alfa.point(lambda v: 255 if v > 80 else 0).getbbox()
          folga = 12
          caixa = (max(caixa[0] - folga, 0), max(caixa[1] - folga, 0), min(caixa[2] + folga, im.width), min(caixa[3] + folga, im.height))
          im = im.crop(caixa)
          # Acabamento: um pouco mais de contraste, cor e nitidez
          from PIL import ImageEnhance, ImageFilter
          rgb, a = im.convert("RGB"), im.getchannel("A")
          rgb = ImageEnhance.Contrast(rgb).enhance(1.08)
          rgb = ImageEnhance.Color(rgb).enhance(1.12)
          rgb = rgb.filter(ImageFilter.UnsharpMask(radius=2, percent=60, threshold=2))
          im = Image.merge("RGBA", (*rgb.split(), a))
          im.thumbnail((1600, 1600), Image.LANCZOS)
          os.makedirs("assets/img/destaque", exist_ok=True)
          destino = f"assets/img/destaque/ybera-{pid}.webp"
          im.save(destino, "WEBP", quality=88, method=6)
          print("salvo:", destino, im.size, os.path.getsize(destino), "bytes")
      - name: Salvar
        run: |
          git add assets/img/destaque
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recorta a foto do produto em destaque (automático)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
