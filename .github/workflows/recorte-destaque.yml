name: Recortar foto do produto em destaque

# Baixa a foto grande de um produto da Ybera, tira o fundo (fica
# transparente) e dá um acabamento (contraste, nitidez), para ele flutuar
# no fundo da Loja Ybera, atrás dos produtos.
# Para trocar o produto: aba Actions → esta tarefa → Run workflow → número
# do produto (o número no fim do link, ex.: 150264). Depois, em
# data/ybera.js, troque o caminho em produtoFundo para ybera-<número>.webp.
on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Número do produto da Ybera (ex.: 150264)"
        required: true
        default: "150264"
  push:
    branches: [claude/editar-minha-curadoria-l4zjab]
    paths: [.github/workflows/recorte-destaque.yml]

permissions:
  contents: write

jobs:
  recortar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUTO: ${{ github.event.inputs.produto || '150264' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o recortador
        run: pip install --quiet "rembg[cpu]" pillow
      - name: Baixar e recortar
        shell: python
        run: |
          import io, json, os, re, urllib.request
          from PIL import Image
          from rembg import new_session, remove
          pid = os.environ["PRODUTO"].strip()
          cat = json.load(open("data/ybera-catalogo.json", encoding="utf-8"))
          prod = next(p for p in cat["produtos"] if p["id"] == pid)
          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          base = re.sub(r"\?.*$", "", prod["imagem"])
          # Pega a maior versão da foto que a loja tiver
          melhor = None
          for lado in (4000, 3000, 2400, 2000, 1400):
              try:
                  bruto = urllib.request.urlopen(urllib.request.Request(f"{base}?w={lado}&h={lado}", headers={"user-agent": ua}), timeout=60).read()
                  tam = Image.open(io.BytesIO(bruto)).size
                  print(f"pedido {lado}px → recebido {tam}, {len(bruto)} bytes")
                  if not melhor or tam[0] > melhor[1][0]:
                      melhor = (bruto, tam)
              except Exception as e:
                  print(f"pedido {lado}px falhou: {e}")
          dados, tam = melhor
          print("usando foto de", tam)
          # Tira o fundo: tenta o recortador mais caprichado primeiro
          im = None
          for modelo in ("birefnet-general", "isnet-general-use", "u2net"):
              try:
                  teste = Image.open(io.BytesIO(remove(dados, session=new_session(modelo)))).convert("RGBA")
              except Exception as e:
                  print(modelo, "falhou:", e)
                  continue
              opacos = sum(1 for v in teste.getchannel("A").getdata() if v > 200) / (teste.width * teste.height)
              print(modelo, "parte opaca:", round(opacos, 3))
              if 0.04 < opacos < 0.5:
                  im = teste
                  print("recorte escolhido:", modelo)
                  break
          if im is None:
              raise SystemExit("nenhum recorte tirou o fundo direito; nada foi salvo")
          # Corta pelo que é visível de verdade (ignora sombra quase transparente)
          alfa = im.getchannel("A")
          alfa = alfa.point(lambda v: 0 if v < 24 else v)
          im.putalpha(alfa)
          caixa = alfa.point(lambda v: 255 if v > 80 else 0).getbbox()
          folga = 16
          caixa = (max(caixa[0] - folga, 0), max(caixa[1] - folga, 0), min(caixa[2] + folga, im.width), min(caixa[3] + folga, im.height))
          im = im.crop(caixa)
          print("produto recortado:", im.size)
          # Tamanho final: 2000px de altura (nítido mesmo em celular de tela fina)
          from PIL import ImageEnhance, ImageFilter
          if im.height < 2000:
              fator = 2000 / im.height
              im = im.resize((round(im.width * fator), 2000), Image.LANCZOS)
          else:
              im.thumbnail((4000, 2000), Image.LANCZOS)
          # Acabamento leve (as cores ficam por conta do site): nitidez e contraste
          rgb, a = im.convert("RGB"), im.getchannel("A")
          rgb = ImageEnhance.Contrast(rgb).enhance(1.05)
          rgb = rgb.filter(ImageFilter.UnsharpMask(radius=2.4, percent=90, threshold=2))
          im = Image.merge("RGBA", (*rgb.split(), a))
          os.makedirs("assets/img/destaque", exist_ok=True)
          destino = f"assets/img/destaque/ybera-{pid}.webp"
          im.save(destino, "WEBP", quality=92, method=6, alpha_quality=100)
          print("salvo:", destino, im.size, os.path.getsize(destino), "bytes")
      - name: Salvar
        run: |
          git add assets/img/destaque
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recorta a foto do produto em destaque (automático)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
