name: Recortar foto do produto em destaque

# Baixa a foto grande de um produto da Ybera, tira o fundo (fica
# transparente) e dá um acabamento (contraste, nitidez), para ele flutuar
# no fundo da Loja Ybera, atrás dos produtos.
# Para trocar o produto: aba Actions → esta tarefa → Run workflow → número
# do produto (o número no fim do link, ex.: 150264). Depois, em
# data/ybera.js, troque o caminho em produtoFundo para ybera-<número>.webp.
on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Número do produto da Ybera (ex.: 150264)"
        required: true
        default: "150264"
  push:
    branches: [claude/editar-minha-curadoria-l4zjab]
    paths: [.github/workflows/recorte-destaque.yml]

permissions:
  contents: write

jobs:
  recortar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUTO: ${{ github.event.inputs.produto || '150264' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o recortador e o ampliador
        run: |
          pip install --quiet "rembg[cpu]" pillow numpy opencv-python-headless
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet basicsr realesrgan
          # conserto conhecido do basicsr com o torchvision novo
          f=$(python -c "import site, os; print(os.path.join(site.getsitepackages()[0], 'basicsr', 'data', 'degradations.py'))")
          echo "consertando $f"
          sed -i 's/torchvision.transforms.functional_tensor/torchvision.transforms.functional/' "$f"
      - name: Baixar, recortar e ampliar
        shell: python
        run: |
          import io, json, os, re, urllib.request
          import numpy as np
          from PIL import Image, ImageFilter
          from rembg import new_session, remove
          pid = os.environ["PRODUTO"].strip()
          cat = json.load(open("data/ybera-catalogo.json", encoding="utf-8"))
          prod = next(p for p in cat["produtos"] if p["id"] == pid)
          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          url = re.sub(r"\?.*$", "", prod["imagem"]) + "?w=1400&h=1400"
          dados = urllib.request.urlopen(urllib.request.Request(url, headers={"user-agent": ua}), timeout=60).read()
          print("foto da loja:", Image.open(io.BytesIO(dados)).size)

          # 1) Tira o fundo. Só aceita se os cantos ficarem transparentes de verdade.
          def cantos_limpos(im):
              a = np.array(im.getchannel("A"))
              h, w = a.shape
              c = max(8, min(h, w) // 40)
              return max(a[:c, :c].mean(), a[:c, -c:].mean(), a[-c:, :c].mean(), a[-c:, -c:].mean()) < 4
          im = None
          for modelo in ("isnet-general-use", "u2net", "birefnet-general"):
              teste = Image.open(io.BytesIO(remove(dados, session=new_session(modelo)))).convert("RGBA")
              ok = cantos_limpos(teste)
              print(modelo, "cantos limpos:", ok)
              if ok:
                  im = teste
                  break
          if im is None:
              raise SystemExit("nenhum recorte tirou o fundo direito; nada foi salvo")

          # 2) Corta pelo que é visível de verdade
          alfa = im.getchannel("A").point(lambda v: 0 if v < 24 else v)
          im.putalpha(alfa)
          caixa = alfa.point(lambda v: 255 if v > 80 else 0).getbbox()
          f = 16
          im = im.crop((max(caixa[0] - f, 0), max(caixa[1] - f, 0), min(caixa[2] + f, im.width), min(caixa[3] + f, im.height)))
          print("produto recortado:", im.size)

          # 3) Amplia 2x com Real-ESRGAN (reconstrói detalhe). A transparência é ampliada à parte.
          rgb = Image.new("RGB", im.size, (255, 255, 255))
          rgb.paste(im, mask=im.getchannel("A"))
          try:
              from basicsr.archs.rrdbnet_arch import RRDBNet
              from realesrgan import RealESRGANer
              rede = RRDBNet(num_in_ch=3, num_out_ch=3, num_feat=64, num_block=23, num_grow_ch=32, scale=4)
              amp = RealESRGANer(scale=4, model=rede, tile=200, half=False,
                                 model_path="https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth")
              saida, _ = amp.enhance(np.array(rgb)[:, :, ::-1], outscale=2)
              rgb2 = Image.fromarray(saida[:, :, ::-1])
              print("ampliado com Real-ESRGAN:", rgb2.size)
          except Exception as e:
              print("Real-ESRGAN falhou, usando ampliação comum:", e)
              rgb2 = rgb.resize((im.width * 2, im.height * 2), Image.LANCZOS)
          a2 = im.getchannel("A").resize(rgb2.size, Image.LANCZOS).filter(ImageFilter.GaussianBlur(0.6))
          final = rgb2.convert("RGBA")
          final.putalpha(a2)
          final.thumbnail((4000, 2000), Image.LANCZOS)
          os.makedirs("assets/img/destaque", exist_ok=True)
          destino = f"assets/img/destaque/ybera-{pid}.webp"
          final.save(destino, "WEBP", quality=92, method=6, alpha_quality=100)
          print("salvo:", destino, final.size, os.path.getsize(destino), "bytes")
      - name: Salvar
        run: |
          git add assets/img/destaque
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recorta a foto do produto em destaque (automático)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
