name: Diagnóstico dos preços da Ybera
on:
  push:
    branches: [claude/editar-minha-curadoria-l4zjab]
    paths: [scripts/diagnostico-ybera.mjs, .github/workflows/diagnostico-ybera.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diagnostico-ybera.mjs
