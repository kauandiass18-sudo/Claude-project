name: Atualizar preços da Ybera

# Todo dia às 6h (horário de Brasília) confere os preços na loja da Ybera
# e atualiza data/ybera.js se algum mudou.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [claude/editar-minha-curadoria-l4zjab]
    paths: [scripts/atualizar-precos.mjs, .github/workflows/precos-ybera.yml]

permissions:
  contents: write

concurrency:
  group: precos-ybera
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ler os preços na loja da Ybera
        run: node scripts/atualizar-precos.mjs
      - name: Salvar se algum preço mudou
        run: |
          if git diff --quiet -- data/ybera.js; then
            echo "Nenhum preço mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ybera.js
          git commit -m "Atualiza preços da Ybera (automático)"
          git push
