name: Diagnóstico mais vendidos (temporário)
on:
  push:
    branches: [claude/editar-minha-curadoria-l4zjab]
    paths: [.github/workflows/diag-mais-vendidos.yml]
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ler página
        timeout-minutes: 3
        shell: python
        run: |
          import re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          req = urllib.request.Request("https://www.ybera.com/mais-vendidos", headers={"user-agent": UA, "accept-language": "pt-BR"})
          h = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          print("tamanho", len(h))
          print("titulo", re.findall(r"<title>([^<]*)", h)[:1])
          i = h.find("escova-progressiva")
          print("escova-progressiva em", i, repr(h[max(0, i - 300): i + 300]))
          ids = []
          for m in re.finditer(r"(?<!\d)(15[01]\d{3})(?!\d)", h):
              if m.group(1) not in ids: ids.append(m.group(1))
          print("ids", len(ids), " ".join(ids[:80]))
          for pad in [r"/produto/[a-z0-9-]+", r'"slug"\s*:\s*"[^"]+"', r'"url"\s*:\s*"[^"]{0,150}"', r'"name"\s*:\s*"[^"]{4,120}"', r"__NUXT__|__NEXT_DATA__|window\.__[A-Z_]+", r'src="[^"]+\.js[^"]*"', r'(?:https?:)?//[^"\' ]*(?:api|graphql|search|vitrine|showcase)[^"\' ]{0,100}']:
              achados = []
              for m in re.finditer(pad, h):
                  if m.group(0) not in achados: achados.append(m.group(0))
              print("---", pad, len(achados)); print("\n".join(achados[:25]))
          i = h.lower().find("mais vendidos")
          print("trecho", repr(h[i: i + 600]))
