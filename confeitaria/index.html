<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Confeitaria artesanal · Doces por encomenda</title>
  <meta name="description" content="Doces e sobremesas artesanais por encomenda. Escolha seus favoritos e encomende pelo WhatsApp.">
  <meta name="theme-color" content="#FBF6EF">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Confeitaria artesanal · Doces por encomenda">
  <meta property="og:description" content="Doces e sobremesas artesanais por encomenda.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="config.js"></script>
</head>
<body>
  <!-- ============================================================ TOPO -->
  <header class="topbar" data-topbar>
    <div class="topbar__inner">
      <a class="logo" href="#inicio" data-brand-logo aria-label="Início"></a>
      <a class="btn btn--primary btn--sm topbar__cta" data-wa target="_blank" rel="noopener">Encomendar</a>
    </div>
  </header>

  <main>
    <!-- ========================================================== HERO -->
    <section class="hero" id="inicio" data-hero>
      <div class="hero__glow hero__glow--a" aria-hidden="true"></div>
      <div class="hero__glow hero__glow--b" aria-hidden="true"></div>

      <div class="hero__inner">
        <div class="hero__text">
          <p class="eyebrow hero__eyebrow intro" style="--d:0" data-brand-desc></p>
          <h1 class="hero__title intro" style="--d:1" data-hero-title></h1>
          <p class="hero__lead intro" style="--d:2" data-hero-sub></p>
        </div>

        <div class="hero__stage" data-stage aria-label="Nossos doces" role="img">
          <div class="hero__halo" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <!-- ================================================= DOCES LIVRES -->
    <section class="solo" id="doces" aria-label="Nossos doces" data-solo></section>

    <!-- ==================================================== ENCOMENDA -->
    <section class="order" id="encomenda" data-order>
      <div class="order__inner">
        <header class="order__head">
          <p class="eyebrow">Encomenda</p>
          <h2 class="order__title" data-order-title></h2>
          <p class="order__lead">Escolha a quantidade de cada doce e envie o pedido pelo WhatsApp.</p>
        </header>
        <ul class="order__list" data-order-list></ul>
        <div class="order__foot">
          <div class="order__summary" aria-live="polite">
            <p class="order__count" data-order-count>Nenhum doce escolhido</p>
            <p class="order__sum"><span>Total</span> <strong data-order-sum>R$ 0,00</strong></p>
          </div>
          <a class="btn btn--primary btn--lg order__send" data-order-send href="#encomenda" target="_blank" rel="noopener">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wa"/></svg>
            Fazer encomenda
          </a>
          <p class="order__hint" data-order-hint aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Ícone do WhatsApp -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.91-2.2-.25-.59-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.27-.2-.57-.35M12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.22-3.74.99 1-3.65-.24-.38a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 7c0 5.45-4.44 9.88-9.89 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.17-1.24-6.16-3.49-8.4"/></symbol>
  </svg>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
