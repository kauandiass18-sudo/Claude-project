<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Composição de niguiris de salmão sobre prancha">
  <defs>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset=".65" stop-color="#ece4d6"/>
      <stop offset="1" stop-color="#cfc4b2"/>
    </linearGradient>
    <linearGradient id="salmon" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset=".45" stop-color="#f4703c"/>
      <stop offset="1" stop-color="#d44a20"/>
    </linearGradient>
    <linearGradient id="salmonShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a1404" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e0011"/>
      <stop offset=".5" stop-color="#c90016"/>
      <stop offset="1" stop-color="#7d0712"/>
    </linearGradient>
    <radialGradient id="soy" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#3a1d10"/>
      <stop offset="1" stop-color="#120804"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="fish">
      <path d="M10 66 C14 36 60 20 112 20 C166 20 208 32 212 60 C214 76 200 84 182 80 C150 74 130 72 110 72 C84 72 62 76 40 82 C22 86 8 80 10 66Z"/>
    </clipPath>
    <g id="nigiri">
      <ellipse cx="112" cy="122" rx="96" ry="14" fill="#000" opacity=".55" filter="url(#soft)"/>
      <path d="M22 84 C22 54 62 46 112 46 C162 46 202 54 202 84 C202 110 166 120 112 120 C58 120 22 110 22 84Z" fill="url(#rice)"/>
      <g fill="none" stroke="#b9ad99" stroke-opacity=".35" stroke-width="1.4">
        <ellipse cx="50" cy="98" rx="6" ry="3"/><ellipse cx="74" cy="108" rx="6" ry="3"/>
        <ellipse cx="100" cy="102" rx="6" ry="3"/><ellipse cx="128" cy="110" rx="6" ry="3"/>
        <ellipse cx="154" cy="100" rx="6" ry="3"/><ellipse cx="178" cy="94" rx="6" ry="3"/>
        <ellipse cx="88" cy="90" rx="5" ry="2.6"/><ellipse cx="140" cy="88" rx="5" ry="2.6"/>
      </g>
      <path d="M10 66 C14 36 60 20 112 20 C166 20 208 32 212 60 C214 76 200 84 182 80 C150 74 130 72 110 72 C84 72 62 76 40 82 C22 86 8 80 10 66Z" fill="url(#salmon)"/>
      <g clip-path="url(#fish)" fill="none" stroke="#ffe9dc" stroke-linecap="round">
        <path d="M26 20 C44 38 46 60 38 92" stroke-width="3.2" opacity=".55"/>
        <path d="M58 14 C78 34 80 60 72 90" stroke-width="2.2" opacity=".45"/>
        <path d="M92 12 C112 34 114 58 106 88" stroke-width="3.6" opacity=".6"/>
        <path d="M128 12 C146 32 148 56 140 86" stroke-width="2.4" opacity=".45"/>
        <path d="M160 14 C178 34 180 56 172 84" stroke-width="3.4" opacity=".55"/>
        <path d="M192 22 C206 38 208 56 202 80" stroke-width="2.2" opacity=".4"/>
      </g>
      <path d="M10 66 C14 36 60 20 112 20 C166 20 208 32 212 60 C214 76 200 84 182 80 C150 74 130 72 110 72 C84 72 62 76 40 82 C22 86 8 80 10 66Z" fill="url(#salmonShade)"/>
      <path d="M48 34 C80 26 132 24 172 32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- prancha -->
  <ellipse cx="320" cy="470" rx="250" ry="34" fill="#000" opacity=".7" filter="url(#soft)"/>
  <g transform="rotate(-9 320 340)">
    <rect x="70" y="250" width="500" height="200" rx="18" fill="url(#board)"/>
    <rect x="70.5" y="250.5" width="499" height="199" rx="17.5" fill="none" stroke="#c9a45c" stroke-opacity=".28"/>
    <path d="M90 300 H550 M90 360 H550 M90 410 H550" stroke="#fff" stroke-opacity=".025" stroke-width="18"/>
  </g>

  <!-- molheira -->
  <g transform="translate(470 182)">
    <ellipse cx="0" cy="16" rx="66" ry="20" fill="#000" opacity=".6" filter="url(#soft)"/>
    <circle r="58" fill="#161616"/>
    <circle r="58" fill="none" stroke="#c9a45c" stroke-opacity=".35"/>
    <circle r="44" fill="url(#soy)"/>
    <ellipse cx="-14" cy="-16" rx="14" ry="6" fill="#fff" opacity=".12" transform="rotate(-24 -14 -16)"/>
  </g>

  <!-- wasabi e gengibre -->
  <g transform="translate(512 282) rotate(-9)">
    <path d="M0 18 C-4 4 10 -8 22 -6 C34 -10 46 4 40 18 C36 26 4 26 0 18Z" fill="#8dbb4c"/>
    <path d="M8 6 C14 0 24 -2 30 2" fill="none" stroke="#c7e48f" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>
  <g transform="translate(506 330) rotate(-9)" fill="#f2b8b0" opacity=".95">
    <path d="M0 10 C10 -6 34 -6 44 8 C30 4 14 4 0 10Z"/>
    <path d="M4 18 C14 4 36 4 46 16 C32 12 18 12 4 18Z" fill="#f6c9c2"/>
  </g>

  <!-- niguiris -->
  <g transform="translate(118 300) rotate(-9)"><use href="#nigiri"/></g>
  <g transform="translate(276 274) rotate(-9)"><use href="#nigiri"/></g>
  <g transform="translate(212 372) rotate(-9) scale(1.06)"><use href="#nigiri"/></g>

  <!-- hashi -->
  <g transform="rotate(-24 340 520)">
    <rect x="96" y="520" width="470" height="11" rx="5.5" fill="url(#stick)"/>
    <rect x="96" y="542" width="470" height="11" rx="5.5" fill="url(#stick)"/>
    <rect x="440" y="520" width="10" height="11" fill="#c9a45c"/>
    <rect x="440" y="542" width="10" height="11" fill="#c9a45c"/>
    <rect x="456" y="520" width="3" height="11" fill="#c9a45c"/>
    <rect x="456" y="542" width="3" height="11" fill="#c9a45c"/>
  </g>
</svg>
